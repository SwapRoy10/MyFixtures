# Weekly pull requests for dependency and GitHub Actions updates.
# Actions stay pinned to commit SHAs; Dependabot updates the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /MyFixturesApp
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
