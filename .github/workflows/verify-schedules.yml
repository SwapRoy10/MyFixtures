name: Verify published schedules
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Website to check
        type: choice
        default: development
        options: [development, production]
permissions:
  contents: read
concurrency:
  group: published-schedule-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    # Six sports 65s apart, plus up to two retries per sport on provider rate limits.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: MyFixturesApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test season boundaries and regression contracts
        run: npm test
      - name: Check published seasons without changing calendars
        env:
          SITE: ${{ (github.event_name == 'schedule' || inputs.target == 'production') && 'https://my-fixtures-api.sorp.workers.dev' || 'https://my-fixtures-api-development.sorp.workers.dev' }}
        run: npm run audit:seasons -- "$SITE"
