name = "my-fixtures-api"
main = "worker.js"
compatibility_date = "2026-09-03"
assets = { directory = ".", binding = "ASSETS" }

[[ratelimits]]
name = "PUBLIC_API_RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

[[durable_objects.bindings]]
name = "CALENDARS"
class_name = "CalendarStore"

[[migrations]]
tag = "living-calendar-v1"
new_sqlite_classes = ["CalendarStore"]

[vars]
# Configure the token with: wrangler secret put FOOTBALL_DATA_API_KEY
